services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres # 管理用 superuser。Mattermost は mmuser で接続する
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MMUSER_PASSWORD: ${MMUSER_PASSWORD}
    volumes:
      - /srv/postgres:${POSTGRES_DATA_MOUNT}
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  mattermost:
    depends_on:
      - postgres
    image: mattermost/mattermost-team-edition:${MATTERMOST_IMAGE_TAG}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MMUSER_PASSWORD}@postgres:5432/mattermost?sslmode=disable
    ports:
      - 8443:8443/udp
      - 8443:8443/tcp
    # コンテナ内は UID/GID 2000:2000。ホスト側は事前に chown 2000:2000 しておく
    volumes:
      - /srv/mattermost/config:/mattermost/config
      - /srv/mattermost/data:/mattermost/data
      - /srv/mattermost/logs:/mattermost/logs
      - /srv/mattermost/plugins:/mattermost/plugins
      - /srv/mattermost/client-plugins:/mattermost/client/plugins
      - /srv/mattermost/bleve-indexes:/mattermost/bleve-indexes

  nginx:
    image: nginx:1.28
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 80:80
      - 443:443
    volumes:
      - ../nginx/mattermost.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/nginx/access.conf:/etc/nginx/access.conf:ro
      - /srv/certs/fullchain.pem:/cert.pem:ro
      - /srv/certs/privkey.pem:/key.pem:ro
      - /srv/certbot:/var/www/certbot:ro

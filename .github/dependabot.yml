version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same as minimumReleaseAge in pnpm-workspace.yaml: an earlier PR fails pnpm install in CI.
    # No groups: a wildcard group ignores the cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
